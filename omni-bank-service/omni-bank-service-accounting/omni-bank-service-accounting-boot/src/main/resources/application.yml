server:
  port: 8105

spring:
  application:
    name: omni-bank-service-accounting
  profiles:
    # 环境通过 SPRING_PROFILES_ACTIVE 注入（local / prod），缺省 local
    active: ${SPRING_PROFILES_ACTIVE:local}

# Dubbo RPC（triple 协议）：服务间调用；注册中心地址在 profile 中按环境配置
dubbo:
  application:
    name: ${spring.application.name}
  registry:
    register-mode: instance
    check: false
  protocol:
    name: tri
    port: 20885
  consumer:
    check: false

