server:
  port: 8109

spring:
  application:
    name: omni-bank-service-agent
  profiles:
    # 环境通过 SPRING_PROFILES_ACTIVE 注入（local / prod），缺省 local
    active: ${SPRING_PROFILES_ACTIVE:local}

# Dubbo RPC（triple 协议）：服务间调用；注册中心地址在 profile 中按环境配置
dubbo:
  application:
    name: ${spring.application.name}
  registry:
    register-mode: instance
    check: false
  protocol:
    name: tri
    port: 20889
  consumer:
    check: false

# 对公信贷尽调域
omni:
  dd:
    # Outbox 发布器扫描间隔与最大重试次数
    outbox:
      scan-interval-ms: 1000
      max-retries: 5
    # 外部数据适配器：银行/外部接口未确认前只启用显式标记的 Mock 实现
    # Mock 证据的来源系统以 MOCK_ 开头且 isMock=true；关闭后任务初始化不自动采集基础证据
    adapter:
      mock:
        enabled: true
    # 大模型调用（Spring AI ChatClient）：默认 MOCK（不发起外部请求，结果带 mock 标记）
    # 切换真实模型网关时改为 OPENAI_COMPATIBLE，并通过环境变量注入：
    #   OMNI_DD_LLM_BASE_URL / OMNI_DD_LLM_API_KEY / OMNI_DD_LLM_MODEL
    llm:
      mode: MOCK
      base-url: ${OMNI_DD_LLM_BASE_URL:}
      api-key: ${OMNI_DD_LLM_API_KEY:}
      model: ${OMNI_DD_LLM_MODEL:}
      completions-path: /v1/chat/completions
      connect-timeout-ms: 3000
      request-timeout-ms: 30000
      temperature: 0.20
      max-tokens: 2048
    # 业务场景识别规则：产品编码 / 贷款用途关键词 -> 业务类型
    # 规则口径待银行业务部门确认，确认前仅作辅助分类，低置信度一律标记待确认
    scenario:
      confidence-threshold: 0.60
      unmatched-confidence: 0.30
      rules:
        - name: 流动资金贷款-原材料采购
          product-codes:
            - CORPORATE_WORKING_CAPITAL
          purpose-keywords:
            - 原材料
            - 采购
            - 备货
          business-type: WORKING_CAPITAL
          sub-scenario: RAW_MATERIAL_PURCHASE
          confidence: 0.90
        - name: 固定资产贷款
          product-codes:
            - CORPORATE_FIXED_ASSET
          purpose-keywords:
            - 厂房
            - 设备
            - 项目建设
          business-type: FIXED_ASSET
          sub-scenario: EQUIPMENT_OR_PLANT
          confidence: 0.88
        - name: 贸易融资
          product-codes:
            - CORPORATE_TRADE_FINANCE
          purpose-keywords:
            - 信用证
            - 保函
            - 进出口
          business-type: TRADE_FINANCE
          sub-scenario: TRADE_SETTLEMENT
          confidence: 0.85
