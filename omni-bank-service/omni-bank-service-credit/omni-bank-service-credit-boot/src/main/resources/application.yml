server:
  port: 8103

spring:
  application:
    name: omni-bank-service-credit
  profiles:
    # 环境通过 SPRING_PROFILES_ACTIVE 注入（local / prod / demo），缺省 local
    active: ${SPRING_PROFILES_ACTIVE:local}

# Dubbo RPC（triple 协议）：服务间调用；注册中心地址在 profile 中按环境配置
dubbo:
  application:
    name: ${spring.application.name}
  registry:
    register-mode: instance
    check: false
  protocol:
    name: tri
    port: 20883
  consumer:
    check: false

