server:
  port: 8101

spring:
  application:
    name: omni-bank-service-customer
  cloud:
    nacos:
      discovery:
        # 与网关一致：本地无 Nacos 默认关闭注册，NACOS_ENABLED=true 打开
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

# Dubbo RPC（triple 协议）：服务间调用；注册中心复用 Nacos，无 Nacos 时 check=false 允许裸启动
dubbo:
  application:
    name: ${spring.application.name}
  registry:
    # 默认 N/A（无注册中心，骨架期裸启动）；联调/部署时注入真实地址：-DDUBBO_REGISTRY_ADDRESS=nacos://127.0.0.1:8848
    # 注意：nacos-client 3.x 创建 ConfigService 时强制 server status check，注册中心不可达会阻断启动，故不能写死 nacos 地址
    address: ${DUBBO_REGISTRY_ADDRESS:N/A}
    register-mode: instance
    check: false
  protocol:
    name: tri
    port: 20881
  consumer:
    check: false

